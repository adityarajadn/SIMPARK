<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPARK-UB — Beranda</title>
  
  <!-- Space Grotesk Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Leaflet CSS (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <simpark-header active="home" root-path="./"></simpark-header>

  <!-- Konten Beranda (D01_Home) -->
  <main class="app-content container-xxl mt-4" data-page="home">
    <p id="app-status" class="alert alert-info" role="status">Memuat data parkir…</p>
    <noscript><p>Aktifkan JavaScript untuk menjalankan simulasi SIMPARK-UB.</p></noscript>
    <div data-content hidden>
      <div class="page-heading mb-3">
        <div>
          <p class="text-caption mb-1">Simulasi konteks jadwal SIAM UB</p>
          <h1 class="title-h1 mb-0">Halo, mau parkir ke mana hari ini?</h1>
        </div>
        <div class="simpark-field">
          <label for="destination">Gedung tujuan</label>
          <select id="destination" class="form-select custom-input"></select>
        </div>
      </div>

      <a id="resume-parking" class="btn-simpark-secondary mb-3" hidden></a>
      <div class="row g-3 mb-4">
        <div class="col-lg-7">
          <section class="hero-recommendation-box h-100" aria-labelledby="recommendation-title">
            <p id="recommendation-label" class="text-overline recommendation-label mb-1">Rekomendasi terbaik</p>
            <div class="zone-card-heading">
              <h2 id="recommendation-title" class="title-h1 text-white mb-2"></h2>
              <span id="recommendation-capacity" class="badge-simpark" hidden></span>
            </div>
            <p id="recommendation-reason" class="mb-3"></p>
            <div class="action-row mb-3">
              <a id="recommendation-link" class="btn-simpark-accent">Lihat Detail Zona</a>
              <a id="manual-link" class="btn-simpark-inverse" href="pages/explore.html">Pilih Parkir Manual</a>
            </div>
            <dl id="recommendation-metrics" class="recommendation-metrics mb-0">
              <div class="stat-tile tone-blue"><dt>Estimasi</dt><dd id="recommendation-time"></dd></div>
              <div class="stat-tile tone-blue"><dt>Slot tersedia</dt><dd id="recommendation-slots"></dd></div>
              <div class="stat-tile tone-blue"><dt>Antrean</dt><dd id="recommendation-queue"></dd></div>
            </dl>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card-simpark h-100" aria-labelledby="home-map-title">
            <h2 id="home-map-title" class="title-h3 mb-3">Posisi zona</h2>
            <simpark-map height="320px"></simpark-map>
          </section>
        </div>
      </div>

      <section id="alternatives" aria-labelledby="alternatives-title">
        <h2 id="alternatives-title" class="title-h2 mb-3">Alternatif zona</h2>
        <div id="alternative-zones" class="zone-card-grid"></div>
      </section>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS (CDN) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- App Logic -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
