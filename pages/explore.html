<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPARK-UB — Cari Parkir</title>
  
  <!-- Space Grotesk Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Leaflet CSS (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <simpark-header active="explore" root-path="../"></simpark-header>

  <!-- Konten Cari Parkir (D02_Explore) -->
  <main class="app-content container-xxl mt-4" data-page="explore">
    <p id="app-status" class="alert alert-info" role="status">Memuat data parkir…</p>
    <noscript><p>Aktifkan JavaScript untuk menjalankan simulasi SIMPARK-UB.</p></noscript>
    <div data-content hidden>
      <p class="text-caption mb-1">Kapasitas dan estimasi simulasi</p>
      <h1 class="title-h1 mb-3">Cari Parkir</h1>
      <div class="explore-controls mb-3">
        <div class="simpark-field">
          <label for="destination">Gedung tujuan</label>
          <select id="destination" class="form-select custom-input"></select>
        </div>
        <div class="simpark-field">
          <label for="zone-search">Cari gedung atau zona</label>
          <input id="zone-search" type="search" class="form-control custom-input" placeholder="Nama atau kode" autocomplete="off">
        </div>
        <div class="simpark-field">
          <label for="zone-sort">Urutkan</label>
          <select id="zone-sort" class="form-select custom-input">
            <option value="time">Waktu tercepat</option>
            <option value="slots">Slot terbanyak</option>
            <option value="distance">Jarak terdekat</option>
          </select>
        </div>
      </div>

      <div id="matching-buildings" class="d-flex flex-wrap gap-2 mb-3" aria-label="Gedung yang cocok"></div>
      <div class="d-flex flex-wrap gap-2 mb-3" id="explore-filter-chips" role="group" aria-label="Ketersediaan zona">
        <button type="button" class="chip-simpark active" data-filter="all" aria-pressed="true">Semua</button>
        <button type="button" class="chip-simpark" data-filter="success" aria-pressed="false">Tersedia</button>
        <button type="button" class="chip-simpark" data-filter="warning" aria-pressed="false">Terbatas</button>
        <button type="button" class="chip-simpark" data-filter="error" aria-pressed="false">Hampir penuh / Penuh</button>
      </div>
      <a href="#explore-map" class="d-inline-block d-md-none mb-3">Lihat peta zona ↓</a>

      <div class="explore-grid">
        <section aria-label="Daftar zona">
          <p id="zone-count" class="text-caption mb-3" role="status"></p>
          <div id="zone-results" class="d-grid gap-3"></div>
        </section>
        <section class="card-simpark" id="explore-map" aria-labelledby="explore-map-title">
          <h2 id="explore-map-title" class="title-h3 mb-3">Peta zona</h2>
          <simpark-map height="420px"></simpark-map>
        </section>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS (CDN) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
