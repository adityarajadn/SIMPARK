<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPARK-UB — Cari Parkir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <simpark-header active="explore" root-path="../"></simpark-header>

  <main class="app-content container-xxl mt-4">

    <div class="d-flex flex-wrap align-items-end justify-content-between mb-3 gap-3">
      <div>
        <div class="text-caption mb-1">Tujuan: Gedung F — FILKOM</div>
        <h1 class="title-h1 mb-0">Cari Parkir</h1>
      </div>
      <div class="text-caption">Kapasitas diperbarui 1 menit lalu (simulasi)</div>
    </div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <div class="d-flex flex-wrap align-items-center gap-3 w-100 w-lg-auto">

        <simpark-input placeholder="Cari gedung atau zona" icon="search" style-width="380px" root-path="../" class="w-100 w-md-auto"></simpark-input>

        <div class="d-flex flex-wrap gap-2" id="explore-filter-chips">
          <simpark-chip label="Semua" active="true" data-filter="all"></simpark-chip>
          <simpark-chip label="Tersedia" active="false" data-filter="success"></simpark-chip>
          <simpark-chip label="Terbatas" active="false" data-filter="warning"></simpark-chip>
          <simpark-chip label="Penuh" active="false" data-filter="error"></simpark-chip>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 w-100 w-sm-auto justify-content-between justify-content-sm-start">
        <span class="text-caption fw-medium">Urutkan</span>
        <simpark-input
          value="Waktu tercepat"
          chevron="true"
          options="Waktu tercepat, Slot terbanyak, Jarak terdekat"
          style-width="200px"
          root-path="../"
          class="flex-grow-1 flex-sm-grow-0">
        </simpark-input>
      </div>
    </div>

    <div class="row g-4">

      <div class="col-lg-4 d-flex flex-column gap-3">
        <div class="text-caption">3 zona ditemukan · urut waktu tercepat</div>

        <simpark-zone-card
          zone-key="A"
          name="Parkir Teknik Utara"
          status-tone="success"
          status-text="Tersedia · 45 slot"
          estimate="8 menit"
          slots="45 / 100"
          queue="Rendah"
          selected="true"
          href="detail.html?zone=A">
        </simpark-zone-card>

        <simpark-zone-card
          zone-key="B"
          name="Parkir FILKOM Selatan"
          status-tone="warning"
          status-text="Terbatas · 12 slot"
          estimate="9 menit"
          slots="12 / 80"
          queue="Sedang"
          href="detail.html?zone=B">
        </simpark-zone-card>

        <simpark-zone-card
          zone-key="C"
          name="Parkir Gedung Rektorat"
          status-tone="error"
          status-text="Penuh · 0 slot"
          estimate="11 menit"
          slots="0 / 60"
          queue="Tinggi"
          href="detail.html?zone=C">
        </simpark-zone-card>

        <simpark-alert
          tone="warning"
          title="Tiket bukan reservasi slot"
          body="Slot berkurang hanya setelah scan masuk valid.">
        </simpark-alert>
      </div>

      <div class="col-lg-8">
        <div class="card-simpark p-0 h-100 overflow-hidden" style="min-height: 520px;">
          <simpark-map height="520px" root-path="../" class="h-100 d-block"></simpark-map>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="../assets/js/components/index.js"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
