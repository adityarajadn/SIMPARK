<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPARK-UB — Parkir Aktif</title>
  
  <!-- Space Grotesk Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Leaflet CSS (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <simpark-header active="home" root-path="../"></simpark-header>

  <!-- Konten Parkir Aktif (D05_ActiveParking) -->
  <main class="app-content container-xxl mt-4" data-page="active">
    <p id="app-status" class="alert alert-info" role="status">Memuat data parkir…</p>
    <noscript><p>Aktifkan JavaScript untuk menjalankan simulasi SIMPARK-UB.</p></noscript>
    <div data-content hidden>
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 id="active-heading" tabindex="-1" class="title-h1 mb-0">Parkir Aktif</h1>
        <span id="active-status" class="badge-simpark badge-success-simpark" hidden></span>
      </div>
      <p id="active-message" class="alert alert-info" role="status" hidden></p>
      <div id="active-content" class="row g-3" hidden>
        <div class="col-lg-7">
          <section class="card-simpark" aria-labelledby="vehicle-title">
            <h2 id="vehicle-title" class="title-h3 mb-3">Lokasi kendaraan</h2>
            <simpark-map height="320px"></simpark-map>
            <form id="location-form" class="mt-3">
              <label for="location-note" class="text-caption fw-medium mb-1">Catatan lokasi spesifik</label>
              <div class="note-controls">
                <input id="location-note" class="form-control custom-input" maxlength="200" placeholder="Misal: dekat tangga barat">
                <button id="save-location" class="btn-simpark-secondary" type="submit">Simpan Lokasi</button>
              </div>
            </form>
            <p id="note-message" class="text-caption mt-2 mb-0" role="status" hidden></p>
          </section>
        </div>
        <div class="col-lg-5">
          <section class="card-simpark" aria-labelledby="transaction-title">
            <h2 id="transaction-title" class="title-h3 mb-3">Detail transaksi</h2>
            <dl class="simpark-metadata">
              <div><dt>ID tiket</dt><dd id="active-id"></dd></div>
              <div><dt>Zona</dt><dd id="active-zone"></dd></div>
              <div><dt>Gedung tujuan</dt><dd id="active-destination"></dd></div>
              <div><dt>Masuk</dt><dd id="active-entered"></dd></div>
              <div id="exit-time-row" hidden><dt>Keluar</dt><dd id="active-exited"></dd></div>
              <div><dt>Durasi</dt><dd id="active-duration"></dd></div>
            </dl>
            <div class="d-grid gap-2">
              <button id="open-exit-confirmation" class="btn-simpark-primary" type="button">Simulasikan Keluar Parkir</button>
              <a id="view-history" href="history.html" class="btn-simpark-primary" hidden>Lihat Riwayat</a>
            </div>
          </section>
        </div>
      </div>
      <a id="active-explore" href="explore.html" class="btn-simpark-secondary mt-3" hidden>Cari Parkir</a>

      <dialog id="confirm-exit-dialog" class="simpark-dialog" aria-labelledby="exit-title">
        <h2 id="exit-title" class="title-h2 mb-2">Konfirmasi keluar parkir</h2>
        <p>Simulasikan verifikasi keluar untuk tiket <strong id="exit-ticket"></strong>.</p>
        <p id="exit-error" class="alert alert-warning" role="status" hidden></p>
        <form method="dialog" class="d-grid gap-2">
          <button id="confirm-exit" class="btn-simpark-primary" type="button">Ya, Selesai Keluar</button>
          <button class="btn-simpark-secondary" autofocus>Tetap Parkir</button>
        </form>
      </dialog>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS (CDN) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
