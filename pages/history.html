<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPARK-UB — Riwayat Parkir</title>
  
  <!-- Space Grotesk Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- DataTables CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <simpark-header active="history" root-path="../"></simpark-header>

  <!-- Konten Riwayat Parkir (D06_History) -->
  <main class="app-content container-xxl mt-4" data-page="history">
    <p id="app-status" class="alert alert-info" role="status">Memuat data parkir…</p>
    <noscript><p>Aktifkan JavaScript untuk menjalankan simulasi SIMPARK-UB.</p></noscript>
    <div data-content hidden>
      <p class="text-caption mb-1">Transaksi simulasi di browser ini</p>
      <h1 class="title-h1 mb-3">Riwayat Parkir</h1>
      <p id="history-empty" class="alert alert-info" hidden>Belum ada transaksi selesai. Riwayat muncul setelah simulasi keluar parkir.</p>
      <div id="history-content" hidden>
        <dl class="history-metrics mb-3">
          <div class="stat-tile tone-light"><dt>Total Parkir</dt><dd id="history-total"></dd></div>
          <div class="stat-tile tone-light"><dt>Zona Favorit</dt><dd id="history-favorite"></dd></div>
          <div class="stat-tile tone-light"><dt>Rata-rata Durasi</dt><dd id="history-duration"></dd></div>
        </dl>
        <div class="card-simpark p-3">
          <div class="table-responsive">
            <table id="simpark-history-datatable" class="table table-hover align-middle w-100 mb-0">
              <caption class="visually-hidden">Transaksi parkir yang sudah selesai</caption>
              <thead class="table-light">
                <tr>
                  <th scope="col">ID Tiket</th>
                  <th scope="col">Zona</th>
                  <th scope="col">Tanggal</th>
                  <th scope="col">Masuk</th>
                  <th scope="col">Keluar</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>
  <!-- Bootstrap 5 JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
